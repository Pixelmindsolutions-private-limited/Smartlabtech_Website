<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Theme -->
  <meta name="theme-color" content="#0f2356" />

  <!-- SEO -->
  <title>
    SmartLabTech | Scientific Instruments & Laboratory Equipment Solutions
  </title>

  <meta
    name="title"
    content="SmartLabTech | Scientific Instruments & Laboratory Equipment Solutions"
  />

  <meta
    name="description"
    content="SmartLabTech provides premium laboratory instruments, scientific equipment, testing solutions, and technical support for research labs, pharma, healthcare, and educational institutions."
  />

  <meta
    name="keywords"
    content="laboratory equipment, scientific instruments, lab solutions, testing equipment, pharma instruments, research laboratory products, analytical instruments, lab machines, SmartLabTech"
  />

  <meta
    name="author"
    content="SmartLabTech"
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://smartlabtech.com/"
  />

  <!-- Favicon -->
  <link rel="icon" href="/logo.png" />

  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://smartlabtech.com/"
  />

  <meta
    property="og:title"
    content="SmartLabTech | Scientific Instruments & Laboratory Equipment Solutions"
  />

  <meta
    property="og:description"
    content="Premium laboratory instruments, scientific equipment, analytical solutions, and technical support for research and healthcare industries."
  />

  <meta
    property="og:image"
    content="/logo.png"
  />

  <meta
    property="og:site_name"
    content="SmartLabTech"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="SmartLabTech | Scientific Instruments & Laboratory Equipment Solutions"
  />

  <meta
    name="twitter:description"
    content="Advanced scientific instruments and laboratory equipment solutions for pharma, healthcare, research, and education."
  />

  <meta
    name="twitter:image"
    content="/logo.png"
  />

  <!-- Mobile App -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- Manifest -->
  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Optional Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="root"></div>

</body>

</html>
